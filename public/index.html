<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول - Free Gency</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .logo {
        text-align: center;
        margin-bottom: 30px;
      }

      .logo h1 {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 10px;
      }

      .logo p {
        color: #718096;
        font-size: 1rem;
      }

      .demo-section {
        text-align: center;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #e2e8f0;
      }

      .demo-section p {
        color: #718096;
        font-size: 14px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card login-card fade-in">
        <!-- Logo Section -->
        <div class="logo">
          <h1>Free Gency</h1>
          <p>منصة إدارة المشاريع والمهام</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
          <div class="form-group">
            <label for="email">البريد الإلكتروني</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="أدخل بريدك الإلكتروني"
              required
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label for="password">كلمة المرور</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="أدخل كلمة المرور"
              required
              autocomplete="current-password"
            />
          </div>

          <!-- Error/Success Messages -->
          <div id="errorMessage" class="status" style="display: none"></div>

          <!-- Loading Indicator -->
          <div id="loading" class="status status-loading" style="display: none">
            <span class="loading"></span> جاري تسجيل الدخول...
          </div>

          <!-- Submit Button -->
          <button type="submit" id="submitBtn" class="btn btn-primary">
            تسجيل الدخول
          </button>
        </form>

        <!-- Demo Section -->
        <div class="demo-section">
          <p>للاختبار السريع:</p>
          <button
            type="button"
            class="btn btn-secondary btn-small"
            onclick="demoLogin()"
          >
            استخدام بيانات تجريبية
          </button>
        </div>

        <!-- Footer -->
        <div
          style="
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
          "
        >
          <p style="color: #718096; font-size: 12px">
            © 2024 Free Gency - جميع الحقوق محفوظة
          </p>
        </div>
      </div>
    </div>

    <script src="js/login.js"></script>
  </body>
</html>
